<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>INSTA LKOGY — الصفحة غير موجودة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{
      min-height:100vh;
      background:linear-gradient(135deg,#833ab4 0%,#fd1d1d 50%,#fcb045 100%);
      display:flex;flex-direction:column;justify-content:center;align-items:center;
      color:#fff;text-align:center;padding:24px;overflow:hidden;position:relative;
    }
    /* Floating particles */
    .particle{
      position:absolute;border-radius:50%;pointer-events:none;animation:floatUp linear infinite;opacity:0.15;
    }
    @keyframes floatUp{
      0%{transform:translateY(100vh) rotate(0deg);}
      100%{transform:translateY(-120px) rotate(720deg);}
    }
    /* Card */
    .card{
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:28px;
      padding:44px 36px;
      max-width:420px;
      width:100%;
      box-shadow:0 20px 60px rgba(0,0,0,0.25);
      animation:cardIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes cardIn{
      from{opacity:0;transform:scale(0.85) translateY(30px);}
      to{opacity:1;transform:scale(1) translateY(0);}
    }
    .cross{font-size:52px;animation:crossBeat 2s ease-in-out infinite;display:block;margin-bottom:8px;}
    @keyframes crossBeat{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

    .code{
      font-size:88px;font-weight:900;line-height:1;
      background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.6) 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      letter-spacing:-4px;
      text-shadow:none;
    }
    .emoji{font-size:48px;margin:10px 0;display:block;animation:wobble 3s ease-in-out infinite;}
    @keyframes wobble{
      0%,100%{transform:rotate(-8deg);}
      50%{transform:rotate(8deg);}
    }
    h1{font-size:22px;font-weight:900;margin:8px 0 6px;}
    p{font-size:14px;color:rgba(255,255,255,0.8);line-height:1.7;margin-bottom:28px;}

    .btn-back{
      display:inline-flex;align-items:center;gap:10px;
      background:rgba(255,255,255,0.22);
      border:2px solid rgba(255,255,255,0.45);
      color:#fff;padding:14px 32px;border-radius:50px;
      font-size:16px;font-weight:900;cursor:pointer;
      text-decoration:none;
      transition:all 0.25s ease;
      box-shadow:0 4px 18px rgba(0,0,0,0.18);
    }
    .btn-back:hover{
      background:rgba(255,255,255,0.35);
      transform:translateY(-3px);
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
    }
    .btn-back:active{transform:translateY(0);}

    .brand{
      margin-top:32px;
      font-size:11px;color:rgba(255,255,255,0.45);line-height:1.9;
    }
    .brand-name{color:#fcb045;font-weight:900;font-size:13px;}
  </style>
</head>
<body>

  <!-- background particles -->
  <script>
    for(var i=0;i<18;i++){
      var d=document.createElement('div');
      d.className='particle';
      var s=Math.random()*30+8;
      d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'vw;background:rgba(255,255,255,'+((Math.random()*0.12)+0.04)+');animation-duration:'+(Math.random()*14+8)+'s;animation-delay:-'+(Math.random()*14)+'s;';
      document.body.appendChild(d);
    }
  </script>

  <div class="card">
    <span class="cross">✝️</span>
    <div class="code">404</div>
    <span class="emoji">🔍</span>
    <h1>الصفحة غير موجودة!</h1>
    <p>
      يبدو إنك وصلت لمكان ما فيش حاجة هنا 😅<br>
      الصفحة اللي بتدور عليها مش موجودة أو اتنقلت.
    </p>
    <a class="btn-back" href="/">
      <span>🏠</span>
      <span>ارجع للتطبيق</span>
    </a>

    <div class="brand">
      INSTA LKOGY ✝️<br>
      Developed with ❤️ by
      <span class="brand-name">Joseph Fady &amp; Jovany Fady</span><br>
      in collaboration with
      <span class="brand-name">Marc &amp; Sam Team</span>
    </div>
  </div>

</body>
</html>
